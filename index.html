<!doctype html>

<head>

<style>
.intro { padding: 80px 0 56px; }
.intro h1 { font-size: clamp(44px, 8vw, 96px); line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 22px; }
.intro p { font-size: clamp(17px, 1.6vw, 20px); color: var(--ink-2); max-width: 32em; margin: 0; }

.list-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.list-head h2 { margin: 0; font-size: 20px; }
.list-head span { color: var(--ink-3); font-size: 15px; }

.posts { list-style: none; margin: 0; padding: 0; }
.post a { display: grid; grid-template-columns: 9em minmax(0, 1fr) 220px; gap: 12px 40px; padding: 32px 0; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; align-items: start; }
.post time { color: var(--ink-3); font-size: 15px; font-family: var(--f-num); padding-top: 6px; }
.post h3 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 34px); line-height: 1.25; font-weight: 750; letter-spacing: -0.01em; }
.post a:hover h3 { color: var(--s1); }
.post p { margin: 0 0 10px; color: var(--ink-2); font-size: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 15px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 0 10px; }

/* 文章缩略图：小量筒 */
.thumb { display: flex; gap: 10px; align-items: flex-end; height: 120px; padding-top: 6px; }
.thumb i { position: relative; flex: 1; height: 100%; border: 2px solid var(--ink); border-top: 0; border-radius: 0 0 8px 8px; }
.thumb i::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: 3px; height: calc((100% - 6px) * var(--v) / 100); background: var(--s1); border-radius: 1px 1px 5px 5px; }

@media (max-width: 760px) {
  .post a { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .thumb { height: 72px; max-width: 200px; order: -1; margin-bottom: 8px; }
}
</style>
</head>
